[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="ish-clans-of-clash-bot"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.110","uvicorn[standard]>=0.27","pydantic>=2.6","pydantic-settings>=2.2","opencv-python-headless>=4.9","numpy>=1.26","pytesseract>=0.3.10","Pillow>=10.0"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
