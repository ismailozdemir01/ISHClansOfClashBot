<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISHClansOfClashBot</title><link rel="stylesheet" href="/static/app.css"></head><body><main><h1>ISHClansOfClashBot</h1><div class="grid"><section class="card"><h2>Status</h2><pre id="status">loading...</pre><button onclick="post('/api/start')">Start</button><button onclick="post('/api/stop')">Stop</button></section><section class="card"><h2>Events</h2><pre id="events"></pre></section></div></main><script>async function post(u){await fetch(u,{method:'POST'});refresh()}async function refresh(){document.querySelector('#status').textContent=JSON.stringify(await (await fetch('/api/status')).json(),null,2)}const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/events');ws.onmessage=e=>{let x=document.querySelector('#events');x.textContent=(x.textContent+'\n'+e.data).slice(-8000)};refresh();setInterval(refresh,1000)</script></body></html>
